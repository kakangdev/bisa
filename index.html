<script type="module">
// KONFIGURASI APLIKASI
const IS_PREVIEW = true; // Ubah menjadi false SAAT DEPLOY / PUBLISH agar terhubung murni ke Firebase tanpa data dummy

// PASTE FIREBASE CONFIG ANDA DI SINI
const firebaseConfig = {
  apiKey: "API_KEY_ANDA",
  authDomain: "PROJECT_ID.firebaseapp.com",
  projectId: "PROJECT_ID",
  storageBucket: "PROJECT_ID.appspot.com",
  messagingSenderId: "SENDER_ID",
  appId: "APP_ID"
};

// ---------- PWA: service worker dari Blob (gagal dengan aman bila browser menolak) ----------
try { navigator.serviceWorker?.register(URL.createObjectURL(new Blob(["self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('fetch',()=>{});"], {type:'text/javascript'}))).catch(()=>{}); } catch {}

// ---------- Util ----------
const $ = s => document.querySelector(s);
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0');
const ym = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}`;
const today = () => { const d = new Date(); return `${ym(d)}-${p2(d.getDate())}`; };
const fmtD = s => s ? new Date(s + 'T00:00').toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}) : '-';
const fmtT = ms => new Date(ms).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
const rnd = n => [...crypto.getRandomValues(new Uint8Array(n))].map(x => x.toString(16).padStart(2,'0')).join('');
const hx = async (pw, salt) => {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({name:'PBKDF2', salt:new TextEncoder().encode(salt), iterations:100000, hash:'SHA-256'}, k, 256);
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
};
const BC = {Berat:'red', Sedang:'orange', Ringan:'green', Baru:'blue', Proses:'orange', Selesai:'green', Terjadwal:'blue', Batal:'gray', 'Menunggu Balasan':'orange', Aktif:'green', Nonaktif:'gray'};
const badge = t => { const c = BC[t] || 'gray'; return `<span class="px-2 py-0.5 rounded text-xs font-medium bg-${c}-100 text-${c}-700 whitespace-nowrap">${e(t)}</span>`; };
const empty = t => `<div class="card text-center text-gray-400 text-sm py-10">${e(t)}</div>`;
let tmr;
const toast = (m, bad) => { const t = $('#ts'); t.textContent = m; t.className = `fixed top-4 left-1/2 -translate-x-1/2 z-[70] px-4 py-2 rounded-lg text-sm text-white shadow-lg ${bad ? 'bg-red-600' : 'bg-green-600'}`; clearTimeout(tmr); tmr = setTimeout(() => t.classList.add('hidden'), 3000); };

// ---------- Lapisan data: memori (preview) atau Firestore (produksi) ----------
let F, auth, db; const mem = {}; const watchers = new Set();
const P = p => p.split('/');
const DB = {
  sub(p, cb, w) {
    if (w) w = w.length === 3 ? w : [w[0], '==', w[1]];
    if (IS_PREVIEW) {
      const f = () => cb(Object.entries(mem[p] || {}).map(([id, v]) => ({id, ...v})).filter(x => !w || (w[1] === '==' ? x[w[0]] === w[2] : x[w[0]] >= w[2])));
      watchers.add(f); f(); return () => watchers.delete(f);
    }
    let q = F.collection(db, ...P(p)); if (w) q = F.query(q, F.where(w[0], w[1], w[2]));
    return F.onSnapshot(q, s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))), er => toast('Gagal memuat data: ' + er.code, 1));
  },
  async get(p, id) {
    if (IS_PREVIEW) return mem[p]?.[id] ? {id, ...mem[p][id]} : null;
    const s = await F.getDoc(F.doc(db, ...P(p), id)); return s.exists() ? {id, ...s.data()} : null;
  },
  async set(p, id, d) {
    if (IS_PREVIEW) { mem[p] ??= {}; mem[p][id] = {...(mem[p][id] || {}), ...d}; watchers.forEach(f => f()); return; }
    await F.setDoc(F.doc(db, ...P(p), id), d, {merge:true});
  },
  async add(p, d) { if (IS_PREVIEW) return this.set(p, rnd(8), d); await F.addDoc(F.collection(db, ...P(p)), d); },
  async del(p, id) {
    if (IS_PREVIEW) { delete mem[p]?.[id]; watchers.forEach(f => f()); return; }
    await F.deleteDoc(F.doc(db, ...P(p), id));
  }
};

  mem.pengaturan = {sekolah: {namaSekolah:'SMP Contoh Nusantara', tahunAjaran:'2026/2027', batasPoin:40}};

// ---------- State ----------
let S = null, D = {}, unsubs = [], charts = [], view = 'dashboard', sel = null, Q = '', mu = null, mt = null, MS = [], fails = 0, mode = 'admin';
const R = {from: ym(new Date()) + '-01', to: today()};
let ks = null, KF = 'all', LK = [], ku = null, kt = null;
const g = () => S?.role === 'gurubk';
const resetD = () => D = {absensi:[], users:[], agenda_bk:[], catatan_pribadi:[], bimbingan_sesi:[], chats:[], kelas:[], admins:[], kasus:[], tatib:[], sekolah:{}};
resetD();
const nm = id => D.users.find(u => u.id === id)?.nama || '-';
const ROLE = () => ({gurubk:'Guru BK', wakasek:'Wakasek Kesiswaan', walikelas:'Walikelas ' + (S.kelas || ''), siswa:'Siswa ' + (S.kelas || '')})[S.role];
const RL = {gurubk:'Guru BK', walikelas:'Walikelas', wakasek:'Wakasek Kesiswaan'};
const M = {
  gurubk: [['dashboard','Dashboard','table-cells-large'],['siswa','Siswa','user-group'],['kasus','Kasus','folder-open'],['konsultasi','Konsultasi','comments'],['agenda','Agenda','calendar'],['absensi','Absensi','clipboard-user'],['catatan','Catatan Pribadi','note-sticky'],['monitoring','Monitoring Kasus','eye'],['dokumen','Dokumen Cetak','print'],['laporan','Laporan','chart-column'],['pengaturan','Pengaturan','gear']],

// ---------- Modal & form ----------
const show = h => { $('#mb').classList.remove('!max-w-2xl'); $('#mb').innerHTML = h; $('#md').classList.remove('hidden'); };
const info = (t, h) => show(`<h3 class="font-bold text-lg mb-2">${e(t)}</h3><div class="text-sm text-gray-600 mb-4">${h}</div><div class="flex justify-end"><button onclick="A.close()" class="btn1">Tutup</button></div>`);

const form = (title, fs, vals, save) => {
