<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISA - Buku Bimbingan Siswa Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link id="pwa-manifest" rel="manifest" href="">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 768px) {
            .desktop-sidebar { display: none; }
            .mobile-bottom-nav { display: flex; }
            .main-content { margin-left: 0 !important; margin-bottom: 60px; }
            .right-panel { display: none; } /* Hide live chat panel on small screens by default */
        }
        .menu-active { background-color: rgba(255,255,255,0.1); border-left: 4px solid #facc15; }
    </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden flex">

    <!-- Desktop Sidebar -->
    <aside class="desktop-sidebar w-64 bg-[#1e40af] text-white flex flex-col h-full fixed z-20">
        <div class="p-5 flex items-center gap-3 border-b border-blue-800">
            <div class="bg-white text-blue-800 p-2 rounded flex items-center justify-center font-bold text-xl"><i class="fas fa-book"></i></div>
            <div>
                <h1 class="font-bold text-lg leading-tight">BISA</h1>
                <p class="text-[10px] text-blue-200">Buku Bimbingan Siswa Digital</p>
            </div>
        </div>
        <nav class="flex-1 px-2 py-4 space-y-2 overflow-y-auto">
            <a href="#" onclick="navigate('dashboard')" id="nav-dashboard" class="menu-active flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition"><i class="fas fa-th-large w-5"></i> Dashboard</a>
            <a href="#" onclick="navigate('siswa')" id="nav-siswa" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition"><i class="fas fa-users w-5"></i> Siswa</a>
            <a href="#" onclick="navigate('agenda')" id="nav-agenda" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition"><i class="fas fa-calendar-alt w-5"></i> Agenda BK</a>
            <a href="#" onclick="navigate('konsultasi')" id="nav-konsultasi" class="flex items-center justify-between px-4 py-3 rounded-lg hover:bg-white/10 transition">
                <div class="flex items-center gap-3"><i class="fas fa-comments w-5"></i> Konsultasi</div>
                <span class="bg-green-500 text-xs px-2 py-1 rounded-full text-white">8</span>
            </a>
            <a href="#" onclick="navigate('laporan')" id="nav-laporan" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition"><i class="fas fa-chart-bar w-5"></i> Laporan</a>
            <a href="#" onclick="navigate('pengaturan')" id="nav-pengaturan" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition"><i class="fas fa-cog w-5"></i> Pengaturan</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content flex-1 ml-64 h-full flex flex-col bg-gray-50 overflow-y-auto">
        <!-- Topbar -->
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center z-10 sticky top-0">
            <div class="flex items-center gap-2">
                <span id="preview-badge" class="hidden bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1 rounded-full border border-yellow-300">
                    <i class="fas fa-exclamation-triangle"></i> MODE PREVIEW (Dummy Data)
                </span>
                <h2 id="page-title" class="text-xl font-semibold text-gray-800 hidden md:block">Dashboard</h2>
            </div>
            <div class="flex items-center gap-4">
                <div class="relative hidden md:block">
                    <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
                    <input type="text" placeholder="Search" class="pl-10 pr-4 py-2 border rounded-full text-sm focus:outline-none focus:border-blue-500">
                </div>
                <button class="relative text-gray-500 hover:text-blue-600">
                    <i class="fas fa-bell text-xl"></i>
                    <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">3</span>
                </button>
                <div class="flex items-center gap-3 border-l pl-4">
                    <div class="text-right hidden sm:block">
                        <p class="text-sm font-bold text-gray-700">Admin BK</p>
                        <p class="text-xs text-gray-500">Ibu Citra Lestari</p>
                    </div>
                    <img src="https://ui-avatars.com/api/?name=Citra+Lestari&background=0D8ABC&color=fff" class="w-10 h-10 rounded-full border-2 border-blue-500">
                </div>
            </div>
        </header>

        <!-- View Container -->
        <div id="app-view" class="p-6 flex-1 flex gap-6">
            <!-- Dynamic Content Injected Here -->
        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav hidden fixed bottom-0 w-full bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.1)] z-30 flex justify-around p-3 border-t">
        <a href="#" onclick="navigate('dashboard')" class="text-center text-gray-500 hover:text-blue-600 flex flex-col items-center"><i class="fas fa-th-large text-xl"></i><span class="text-[10px] mt-1">Home</span></a>
        <a href="#" onclick="navigate('siswa')" class="text-center text-gray-500 hover:text-blue-600 flex flex-col items-center"><i class="fas fa-users text-xl"></i><span class="text-[10px]">Siswa</span></a>
        <a href="#" onclick="navigate('konsultasi')" class="text-center text-gray-500 hover:text-blue-600 flex flex-col items-center relative"><i class="fas fa-comments text-xl"></i><span class="text-[10px]">Chat</span><span class="absolute -top-1 right-1 bg-green-500 text-white text-[8px] px-1 rounded-full">8</span></a>
        <a href="#" onclick="navigate('agenda')" class="text-center text-gray-500 hover:text-blue-600 flex flex-col items-center"><i class="fas fa-calendar text-xl"></i><span class="text-[10px]">Agenda</span></a>
    </nav>

<script type="module">
// ==========================================
// KONFIGURASI APLIKASI
// ==========================================
const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY untuk konek ke Firebase murni tanpa dummy

const firebaseConfig = {
apiKey: "AIzaSyDjvlWA79HIwK8j4ksV0SqbcMU3QQ8NpWs",
authDomain: "bisa-f5eb4.firebaseapp.com",
projectId: "bisa-f5eb4",
storageBucket: "bisa-f5eb4.firebasestorage.app",
messagingSenderId: "415777614197",
appId: "1:415777614197:web:81990f05740e33fb754b3c"
};

// ==========================================
// PWA INJECTION (1 FILE ARCHITECTURE)
// ==========================================
const manifest = {
    "name": "BISA - Buku Bimbingan Siswa",
    "short_name": "BISA",
    "display": "standalone",
    "background_color": "#ffffff",
    "theme_color": "#1e40af",
    "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/3143/3143460.png","sizes": "512x512","type": "image/png"}]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
document.getElementById('pwa-manifest').href = URL.createObjectURL(manifestBlob);

// ==========================================
// STATE & DATA MANAGEMENT
// ==========================================
let dummyData = {};
if (IS_PREVIEW) {
    document.getElementById('preview-badge').classList.remove('hidden');
    // Dummy Data untuk Mode Preview
    dummyData = {
        stats: { siswa: 485, sesi: 62, catatan: 1240, notif: 5 },
        chats: [
            { id: 1, name: "Rina Septiani", time: "10:15", msg: "Permisi Bu, ada waktu sebentar?", status: "Aktif", img: "https://ui-avatars.com/api/?name=Rina+S" },
            { id: 2, name: "Ahmad Farhan", time: "10:05", msg: "Saya bingung pilih jurusan...", status: "Menunggu", img: "https://ui-avatars.com/api/?name=Ahmad+F" },
            { id: 3, name: "Maya Puspita", time: "09:30", msg: "Terima kasih sarannya Bu...", status: "Selesai", img: "https://ui-avatars.com/api/?name=Maya+P" }
        ]
    };
}

// ==========================================
// RENDER VIEWS (SPA ROUTING)
// ==========================================
window.navigate = function(view) {
    document.querySelectorAll('.desktop-sidebar a').forEach(el => {
        el.classList.remove('menu-active', 'bg-white/10', 'border-l-4', 'border-yellow-400');
    });
    const activeNav = document.getElementById('nav-' + view);
    if(activeNav) activeNav.classList.add('menu-active', 'bg-white/10', 'border-l-4', 'border-yellow-400');

    const appView = document.getElementById('app-view');
    appView.innerHTML = ''; // Clear current view

    if (view === 'dashboard') renderDashboard(appView);
    else if (view === 'siswa') renderSiswa(appView);
    else if (view === 'agenda') renderAgenda(appView);
    else if (view === 'konsultasi') renderKonsultasi(appView);
    else if (view === 'laporan') renderLaporan(appView);
    else if (view === 'pengaturan') renderPengaturan(appView);
};

function renderDashboard(container) {
    document.getElementById('page-title').innerText = "Student Statistics & Overview";
    
    // Fallback UI if not preview and no data fetched yet
    const stats = IS_PREVIEW ? dummyData.stats : { siswa: 0, sesi: 0, catatan: 0, notif: 0 };
    const chats = IS_PREVIEW ? dummyData.chats : [];

    container.innerHTML = `
        <div class="w-full lg:w-8/12 flex flex-col gap-6">
            <!-- Stats Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-blue-600 text-white p-4 rounded-xl shadow">
                    <p class="text-sm opacity-80">Siswa Terbimbing</p>
                    <div class="flex justify-between items-end mt-2"><h3 class="text-3xl font-bold">${stats.siswa}</h3><i class="fas fa-users text-2xl opacity-50"></i></div>
                </div>
                <div class="bg-green-500 text-white p-4 rounded-xl shadow">
                    <p class="text-sm opacity-80">Sesi Bulan Ini</p>
                    <div class="flex justify-between items-end mt-2"><h3 class="text-3xl font-bold">${stats.sesi}</h3><i class="fas fa-calendar-check text-2xl opacity-50"></i></div>
                </div>
                <div class="bg-orange-200 text-orange-900 p-4 rounded-xl shadow">
                    <p class="text-sm opacity-80">Catatan Bimbingan</p>
                    <div class="flex justify-between items-end mt-2"><h3 class="text-3xl font-bold">${stats.catatan}</h3><i class="fas fa-file-alt text-2xl opacity-50"></i></div>
                </div>
                <div class="bg-red-400 text-white p-4 rounded-xl shadow">
                    <p class="text-sm opacity-80">Notifikasi Penting</p>
                    <div class="flex justify-between items-end mt-2"><h3 class="text-3xl font-bold">${stats.notif}</h3><i class="fas fa-bell text-2xl opacity-50"></i></div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-card p-5 rounded-xl">
                    <h4 class="font-semibold text-sm mb-4">Overview Progres Siswa</h4>
                    <canvas id="chartProgres" height="150"></canvas>
                </div>
                <div class="glass-card p-5 rounded-xl">
                    <h4 class="font-semibold text-sm mb-4">Kehadiran Bimbingan</h4>
                    <canvas id="chartHadir" height="150"></canvas>
                </div>
            </div>

            <!-- Bottom Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-card p-5 rounded-xl">
                    <h4 class="font-semibold text-sm mb-4">Agenda Bimbingan Terdekat</h4>
                    <ul class="space-y-3">
                        <li class="p-3 bg-blue-50 rounded border-l-4 border-blue-500 text-sm"><b>10:00</b> - Sesi Konseling: Rina S.</li>
                        <li class="p-3 bg-green-50 rounded border-l-4 border-green-500 text-sm"><b>14:00</b> - Webinar Kesiapan Kerja</li>
                    </ul>
                </div>
                <div class="glass-card p-5 rounded-xl flex items-center gap-4">
                    <div class="w-1/2"><canvas id="chartDonut"></canvas></div>
                    <div class="w-1/2 text-sm space-y-2">
                        <h4 class="font-bold">Summary Progres</h4>
                        <p><span class="inline-block w-3 h-3 bg-blue-500 rounded-full mr-2"></span>Tuntas (65%)</p>
                        <p><span class="inline-block w-3 h-3 bg-green-500 rounded-full mr-2"></span>Berjalan (25%)</p>
                        <p><span class="inline-block w-3 h-3 bg-orange-400 rounded-full mr-2"></span>Perhatian (10%)</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Live Chat Monitoring -->
        <div class="hidden lg:flex w-4/12 flex-col gap-4 h-full right-panel">
            <div class="glass-card rounded-xl p-4 flex flex-col h-full bg-white shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4 border-b pb-3">
                    <div>
                        <h4 class="font-bold text-gray-800">Fitur Chat Konsultasi</h4>
                        <p class="text-xs text-gray-500">LIVE MONITORING WALIKELAS & BK</p>
                    </div>
                    <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full"><i class="fas fa-circle text-[8px] mr-1"></i>Aktif</span>
                </div>
                
                <div class="flex-1 overflow-y-auto space-y-3 pr-2">
                    ${chats.length === 0 ? '<p class="text-sm text-center text-gray-400 py-10">Belum ada obrolan aktif.</p>' : chats.map(chat => `
                    <div class="p-3 bg-blue-50 rounded-lg border border-blue-100 hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2">
                                <img src="${chat.img}" class="w-8 h-8 rounded-full">
                                <div>
                                    <h5 class="text-sm font-semibold text-gray-800">${chat.name}</h5>
                                    <span class="text-[10px] text-gray-500">${chat.time}</span>
                                </div>
                            </div>
                            <span class="text-[10px] px-2 py-1 rounded bg-${chat.status === 'Aktif' ? 'green' : 'yellow'}-100 text-${chat.status === 'Aktif' ? 'green' : 'yellow'}-700">${chat.status}</span>
                        </div>
                        <p class="text-xs text-gray-600 mb-3 bg-white p-2 rounded border">"${chat.msg}"</p>
                        <div class="flex gap-2">
                            <button class="flex-1 bg-blue-600 text-white text-xs py-1.5 rounded hover:bg-blue-700">Mulai Chat</button>
                            <button class="flex-1 bg-white border border-gray-300 text-gray-600 text-xs py-1.5 rounded hover:bg-gray-50">Tandai Selesai</button>
                        </div>
                    </div>
                    `).join('')}
                </div>
            </div>
        </div>
    `;

    // Render Charts
    setTimeout(() => {
        new Chart(document.getElementById('chartProgres'), {
            type: 'line',
            data: { labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun'], datasets: [{ label: 'Progres', data: [10, 40, 35, 60, 45, 80], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.2)', fill: true, tension: 0.4 }] },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
        new Chart(document.getElementById('chartHadir'), {
            type: 'bar',
            data: { labels: ['Jun', 'Jul', 'Ags', 'Sep', 'Okt'], datasets: [{ label: 'Kehadiran', data: [35, 28, 32, 40, 25], backgroundColor: '#10b981' }] },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
        new Chart(document.getElementById('chartDonut'), {
            type: 'doughnut',
            data: { labels: ['Tuntas', 'Berjalan', 'Perhatian'], datasets: [{ data: [65, 25, 10], backgroundColor: ['#3b82f6', '#10b981', '#fb923c'], borderWidth: 0 }] },
            options: { responsive: true, plugins: { legend: { display: false } }, cutout: '70%' }
        });
    }, 100);
}

// Menu Dummy Renderers (Minimalist to meet rules)
function renderSiswa(container) { container.innerHTML = `<div class="glass-card p-6 rounded-xl w-full"> <h3 class="text-lg font-bold mb-4">Data Siswa</h3> <p class="text-gray-500 text-sm">${IS_PREVIEW ? 'Menampilkan 485 data dummy siswa...' : 'Belum ada data dari Firestore.'}</p> </div>`; document.getElementById('page-title').innerText = "Data Siswa"; }
function renderAgenda(container) { container.innerHTML = `<div class="glass-card p-6 rounded-xl w-full"> <h3 class="text-lg font-bold mb-4">Agenda Bimbingan</h3> <p class="text-gray-500 text-sm">${IS_PREVIEW ? 'Menampilkan jadwal kalender dummy...' : 'Belum ada agenda terdaftar.'}</p> </div>`; document.getElementById('page-title').innerText = "Agenda Bimbingan"; }
function renderKonsultasi(container) { container.innerHTML = `<div class="glass-card p-6 rounded-xl w-full"> <h3 class="text-lg font-bold mb-4">Modul Konsultasi & Monitoring Kasus</h3> <p class="text-gray-500 text-sm">Ruang rekapitulasi sesi konseling.</p> </div>`; document.getElementById('page-title').innerText = "Konsultasi"; }
function renderLaporan(container) { container.innerHTML = `<div class="glass-card p-6 rounded-xl w-full"> <h3 class="text-lg font-bold mb-4">Laporan Rekapitulasi</h3> <button onclick="window.print()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm"><i class="fas fa-print"></i> Cetak / Ekspor PDF</button> </div>`; document.getElementById('page-title').innerText = "Laporan"; }
function renderPengaturan(container) { container.innerHTML = `<div class="glass-card p-6 rounded-xl w-full"> <h3 class="text-lg font-bold mb-4">Pengaturan Sistem</h3> <p class="text-gray-500 text-sm">Manajemen Tahun Ajaran, Rombel, dan Hak Akses Pengguna.</p> </div>`; document.getElementById('page-title').innerText = "Pengaturan"; }

// Init
window.onload = () => navigate('dashboard');
</script>
</body>
</html>
