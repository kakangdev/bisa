<script type="module">
// KONFIGURASI APLIKASI
const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY / PUBLISH agar terhubung murni ke Firebase tanpa data dummy

// PASTE FIREBASE CONFIG ANDA DI SINI
const firebaseConfig = {
apiKey: "AIzaSyDjvlWA79HIwK8j4ksV0SqbcMU3QQ8NpWs",
authDomain: "bisa-f5eb4.firebaseapp.com",
projectId: "bisa-f5eb4",
storageBucket: "bisa-f5eb4.firebasestorage.app",
messagingSenderId: "415777614197",
appId: "1:415777614197:web:81990f05740e33fb754b3c"
};

// ---------- PWA: service worker dari Blob (gagal dengan aman bila browser menolak) ----------
try { navigator.serviceWorker?.register(URL.createObjectURL(new Blob(["self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('fetch',()=>{});"], {type:'text/javascript'}))).catch(()=>{}); } catch {}

// ---------- Util ----------
const $ = s => document.querySelector(s);
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0');
const ym = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}`;
const today = () => { const d = new Date(); return `${ym(d)}-${p2(d.getDate())}`; };
const fmtD = s => s ? new Date(s + 'T00:00').toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}) : '-';
const fmtT = ms => new Date(ms).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
const rnd = n => [...crypto.getRandomValues(new Uint8Array(n))].map(x => x.toString(16).padStart(2,'0')).join('');
const hx = async (pw, salt) => {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({name:'PBKDF2', salt:new TextEncoder().encode(salt), iterations:100000, hash:'SHA-256'}, k, 256);
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
};
const BC = {Berat:'red', Sedang:'orange', Ringan:'green', Baru:'blue', Proses:'orange', Selesai:'green', Terjadwal:'blue', Batal:'gray', 'Menunggu Balasan':'orange', Aktif:'green', Nonaktif:'gray'};
const badge = t => { const c = BC[t] || 'gray'; return `<span class="px-2 py-0.5 rounded text-xs font-medium bg-${c}-100 text-${c}-700 whitespace-nowrap">${e(t)}</span>`; };
const empty = t => `<div class="card text-center text-gray-400 text-sm py-10">${e(t)}</div>`;
let tmr;
const toast = (m, bad) => { const t = $('#ts'); t.textContent = m; t.className = `fixed top-4 left-1/2 -translate-x-1/2 z-[70] px-4 py-2 rounded-lg text-sm text-white shadow-lg ${bad ? 'bg-red-600' : 'bg-green-600'}`; clearTimeout(tmr); tmr = setTimeout(() => t.classList.add('hidden'), 3000); };

// ---------- Lapisan data: memori (preview) atau Firestore (produksi) ----------
let F, auth, db; const mem = {}; const watchers = new Set();
const P = p => p.split('/');
const DB = {
  sub(p, cb, w) {
    if (IS_PREVIEW) {
      const f = () => cb(Object.entries(mem[p] || {}).map(([id, v]) => ({id, ...v})).filter(x => !w || x[w[0]] === w[1]));
      watchers.add(f); f(); return () => watchers.delete(f);
    }
    let q = F.collection(db, ...P(p)); if (w) q = F.query(q, F.where(w[0], '==', w[1]));
    return F.onSnapshot(q, s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))), er => toast('Gagal memuat data: ' + er.code, 1));
  },
  async get(p, id) {
    if (IS_PREVIEW) return mem[p]?.[id] ? {id, ...mem[p][id]} : null;
    const s = await F.getDoc(F.doc(db, ...P(p), id)); return s.exists() ? {id, ...s.data()} : null;
  },
  async set(p, id, d) {
    if (IS_PREVIEW) { mem[p] ??= {}; mem[p][id] = {...(mem[p][id] || {}), ...d}; watchers.forEach(f => f()); return; }
    await F.setDoc(F.doc(db, ...P(p), id), d, {merge:true});
  },
  async add(p, d) { if (IS_PREVIEW) return this.set(p, rnd(8), d); await F.addDoc(F.collection(db, ...P(p)), d); },
  async del(p, id) {
    if (IS_PREVIEW) { delete mem[p]?.[id]; watchers.forEach(f => f()); return; }
    await F.deleteDoc(F.doc(db, ...P(p), id));
  }
};

async function seed() { // Data dummy: HANYA saat IS_PREVIEW
  const s1 = 'a1b2c3d4', s2 = 'e5f6a7b8', n = Date.now();
  mem.admins = {
    'guru@bisa.test': {email:'guru@bisa.test', nama:'Ibu Citra Lestari', role:'gurubk', salt:s1, passwordHash:await hx('guru123', s1)},
    'wali@bisa.test': {email:'wali@bisa.test', nama:'Bapak Dedi Hartono', role:'walikelas', kelas:'7A', salt:s1, passwordHash:await hx('wali123', s1)}
  };
  const ph = await hx('siswa123', s2);
  mem.users = {
    '1001': {nama:'Rina Septiani', nis:'1001', kelas:'7A', jk:'P', aktif:true, salt:s2, passwordHash:ph, chatToken:'tok1001'},
    '1002': {nama:'Ahmad Farhan', nis:'1002', kelas:'8B', jk:'L', aktif:true, salt:s2, passwordHash:ph, chatToken:'tok1002'}
  };
  mem.chats = {
    tok1001: {siswaId:'1001', nama:'Rina Septiani', kelas:'7A', lastMessage:'Permisi Bu, ada waktu sebentar?', lastTime:n-600000, status:'Menunggu Balasan'},
    tok1002: {siswaId:'1002', nama:'Ahmad Farhan', kelas:'8B', lastMessage:'', lastTime:0, status:'Selesai'}
  };
  mem['chats/tok1001/messages'] = {m1: {pengirim:'siswa', teks:'Permisi Bu, ada waktu sebentar?', waktu:n-600000}};
  mem.agenda_bk = {
    a1: {judul:'Konseling Rina', tanggal:today(), jam:'10:00', jenis:'Konseling Individu', siswaId:'1001', status:'Terjadwal'},
    a2: {judul:'Bimbingan Kelompok Kelas 8B', tanggal:today(), jam:'13:00', jenis:'Konseling Kelompok', siswaId:'', status:'Terjadwal'}
  };
  mem.catatan_pribadi = {c1: {judul:'Perkembangan awal semester', kategori:'Perkembangan', siswaId:'1001', kelas:'7A', tanggal:today(), isi:'Rina mulai lebih terbuka saat sesi konseling.'}};
  mem.bimbingan_sesi = {
    s1: {siswaId:'1001', kelas:'7A', tanggal:today(), topik:'Kesulitan belajar matematika', jenis:'Konseling Individu', tingkat:'Sedang', tindak:'Pendampingan belajar', status:'Proses'},
    s2: {siswaId:'1002', kelas:'8B', tanggal:today(), topik:'Sering terlambat masuk kelas', jenis:'Konseling Individu', tingkat:'Berat', tindak:'', status:'Baru'}
  };
  mem.kelas = {k1:{nama:'7A', walikelas:'Bapak Dedi Hartono'}, k2:{nama:'8B', walikelas:''}};
  mem.pengaturan = {sekolah: {namaSekolah:'SMP Contoh Nusantara', tahunAjaran:'2026/2027'}};
}

// ---------- State ----------
let S = null, D = {}, unsubs = [], charts = [], view = 'dashboard', sel = null, Q = '', mu = null, mt = null, MS = [], fails = 0, mode = 'admin';
const R = {from: ym(new Date()) + '-01', to: today()};
const g = () => S?.role === 'gurubk';
const resetD = () => D = {users:[], agenda_bk:[], catatan_pribadi:[], bimbingan_sesi:[], chats:[], kelas:[], admins:[], sekolah:{}};
resetD();
const nm = id => D.users.find(u => u.id === id)?.nama || '-';
const ROLE = () => ({gurubk:'Guru BK', walikelas:'Walikelas ' + (S.kelas || ''), siswa:'Siswa ' + (S.kelas || '')})[S.role];
const M = {
  gurubk: [['dashboard','Dashboard','table-cells-large'],['siswa','Siswa','user-group'],['agenda','Agenda','calendar'],['konsultasi','Konsultasi','comments'],['catatan','Catatan Pribadi','note-sticky'],['monitoring','Monitoring Kasus','eye'],['laporan','Laporan','chart-column'],['pengaturan','Pengaturan','gear']],
  walikelas: [['dashboard','Dashboard','table-cells-large'],['siswa','Siswa','user-group'],['agenda','Agenda','calendar'],['konsultasi','Sesi Konseling','comments'],['monitoring','Monitoring Kasus','eye'],['laporan','Laporan','chart-column'],['pengaturan','Pengaturan','gear']],
  siswa: [['dashboard','Beranda','house'],['agenda','Agenda','calendar'],['konsultasi','Konsultasi','comments'],['pengaturan','Profil','user']]
};

// ---------- Modal & form ----------
const show = h => { $('#mb').classList.remove('!max-w-2xl'); $('#mb').innerHTML = h; $('#md').classList.remove('hidden'); };
const info = (t, h) => show(`<h3 class="font-bold text-lg mb-2">${e(t)}</h3><div class="text-sm text-gray-600 mb-4">${h}</div><div class="flex justify-end"><button onclick="A.close()" class="btn1">Tutup</button></div>`);
let Y; const ask = (t, b, fn) => { Y = fn; show(`<h3 class="font-bold text-lg mb-2">${e(t)}</h3><p class="text-sm text-gray-600 mb-4">${e(b)}</p><div class="flex justify-end gap-2"><button onclick="A.close()" class="btn2">Batal</button><button onclick="A.yes()" class="btn1">Ya, lanjutkan</button></div>`); };
const form = (title, fs, vals, save) => {
  show(`<h3 class="font-bold text-lg mb-3">${e(title)}</h3><form id="fm" class="space-y-3">${fs.map(f => {
    const r = f.req === false ? '' : 'required', v = vals[f.k] ?? '';
    const inner = f.t === 'select'
      ? `<select name="${f.k}" class="inp" ${r}>${f.o.map(o => { const [a, b] = Array.isArray(o) ? o : [o, o]; return `<option value="${e(a)}"${v == a ? ' selected' : ''}>${e(b)}</option>`; }).join('')}</select>`
      : f.t === 'textarea' ? `<textarea name="${f.k}" rows="4" class="inp" ${r}>${e(v)}</textarea>`
      : `<input name="${f.k}" type="${f.t || 'text'}" value="${e(v)}" class="inp" ${r}>`;
    return `<label class="block text-sm font-medium text-gray-700">${e(f.l)}${inner}</label>`;
  }).join('')}<p id="fe" class="text-red-600 text-sm"></p><div class="flex justify-end gap-2"><button type="button" onclick="A.close()" class="btn2">Batal</button><button class="btn1">Simpan</button></div></form>`);
  $('#fm').onsubmit = async ev => {
    ev.preventDefault();
    try { const r = await save(Object.fromEntries(new FormData(ev.target))); if (r) { $('#fe').textContent = r; return; } A.close(); }
    catch (x) { $('#fe').textContent = 'Gagal menyimpan: ' + (x.code || x.message); }
  };
};
const f = (k, l, t, o, req) => ({k, l, t, o, req});
const sisOpt = blank => [...(blank ? [['', '- Tidak dipilih -']] : []), ...D.users.map(u => [u.id, `${u.nama} (${u.kelas})`])];
const FD = c => ({
  agenda_bk: ['Agenda', [f('judul','Judul'), f('tanggal','Tanggal','date'), f('jam','Jam','time'), f('jenis','Jenis','select',['Konseling Individu','Konseling Kelompok','Kunjungan Rumah','Lainnya']), f('siswaId','Siswa (opsional)','select',sisOpt(1),false), f('status','Status','select',['Terjadwal','Selesai','Batal'])]],
  catatan_pribadi: ['Catatan', [f('judul','Judul'), f('tanggal','Tanggal','date'), f('kategori','Kategori','select',['Perkembangan','Perilaku','Akademik','Keluarga','Lainnya']), f('siswaId','Siswa (opsional)','select',sisOpt(1),false), f('isi','Isi catatan','textarea')]],
  bimbingan_sesi: ['Sesi Bimbingan', [f('siswaId','Siswa','select',sisOpt()), f('tanggal','Tanggal','date'), f('topik','Topik / masalah'), f('jenis','Jenis','select',['Konseling Individu','Konseling Kelompok','Kunjungan Rumah','Lainnya']), f('tingkat','Tingkat','select',['Ringan','Sedang','Berat']), f('tindak','Tindak lanjut','textarea',null,false), f('status','Status','select',['Baru','Proses','Selesai'])]]
})[c];
const sv = async (c, id, v) => {
  if (v.siswaId) v.kelas = D.users.find(u => u.id === v.siswaId)?.kelas || ''; else if ('siswaId' in v) v.kelas = '';
  if (id) await DB.set(c, id, v); else await DB.add(c, v);
  toast('Tersimpan');
};

// ---------- Aksi (dipanggil dari HTML) ----------
const A = window.A = {
  close: () => { $('#md').classList.add('hidden'); $('#mb').classList.remove('!max-w-2xl'); },
  yes: async () => { A.close(); try { await Y(); } catch (x) { toast('Gagal: ' + (x.code || x.message), 1); } },
  sb: () => { $('#sb').classList.toggle('-translate-x-full'); $('#ov').classList.toggle('hidden'); },
  go: k => { view = k; if (innerWidth < 768 && !$('#sb').classList.contains('-translate-x-full')) A.sb(); render(); },
  q: v => { Q = v; render(); const i = $('#q'); i.focus(); i.setSelectionRange(v.length, v.length); },
  tab: m => {
    mode = m; $('#lbU').textContent = m === 'admin' ? 'Email' : 'NIS'; $('#lu').type = m === 'admin' ? 'email' : 'text'; $('#le').textContent = '';
    $('#tAdmin').className = 'py-2 rounded-md ' + (m === 'admin' ? 'bg-white shadow text-blue-700' : 'text-gray-500');
    $('#tSiswa').className = 'py-2 rounded-md ' + (m === 'siswa' ? 'bg-white shadow text-blue-700' : 'text-gray-500');
  },
  async login(ev) {
    ev.preventDefault();
    const u = $('#lu').value.trim(), pw = $('#lp').value, btn = $('#lb'); $('#le').textContent = ''; btn.disabled = true; btn.textContent = 'Memproses...';
    try {
      if (mode === 'admin') {
        if (IS_PREVIEW) {
          const a = mem.admins[u.toLowerCase()];
          if (!a || a.passwordHash !== await hx(pw, a.salt)) throw {m:'Email atau password salah.'};
          S = {...a, uid:a.email};
        } else {
          const c = await F.signInWithEmailAndPassword(auth, u, pw);
          const a = await DB.get('admins', c.user.uid);
          if (!a) { await F.signOut(auth); throw {m:'Akun ini belum terdaftar sebagai guru. Hubungi administrator.'}; }
          S = {...a, uid:c.user.uid, email:c.user.email};
        }
      } else {
        if (!/^[A-Za-z0-9]{3,20}$/.test(u)) throw {m:'Format NIS tidak valid.'};
        const s = IS_PREVIEW || db ? await DB.get('users', u) : null;
        if (!s || s.aktif === false || s.passwordHash !== await hx(pw, s.salt)) throw {m:'NIS atau password salah.'};
        S = {role:'siswa', nama:s.nama, kelas:s.kelas, nis:s.id, token:s.chatToken};
      }
      fails = 0; start();
    } catch (x) {

function start() {
  const m = M[S.role], st = S.role !== 'siswa', w = S.role === 'walikelas' ? ['kelas', S.kelas] : null;
  $('#nv').innerHTML = m.map(([k, l, i]) => `<a onclick="A.go('${k}')" data-k="${k}" class="nb"><i class="fa-solid fa-${i} w-5 text-center"></i>${l}</a>`).join('');
  $('#bn').innerHTML = m.slice(0, 4).map(([k, l, i]) => `<a onclick="A.go('${k}')" data-k="${k}" class="bb"><i class="fa-solid fa-${i}"></i>${l.split(' ')[0]}</a>`).join('') + (m.length > 4 ? '<a onclick="A.sb()" class="bb"><i class="fa-solid fa-ellipsis"></i>Lainnya</a>' : '');
  const sb = (p, k, ww) => unsubs.push(DB.sub(p, r => { D[k] = r; render(); }, ww));
  sb('agenda_bk', 'agenda_bk');
  if (st) { sb('kelas', 'kelas'); sb('users', 'users', w); sb('bimbingan_sesi', 'bimbingan_sesi', w); }
  if (g()) { sb('admins', 'admins'); sb('catatan_pribadi', 'catatan_pribadi'); sb('chats', 'chats'); }
  DB.get('pengaturan', 'sekolah').then(s => { if (s) { D.sekolah = s; hd(); } }).catch(() => {});
  view = 'dashboard'; $('#login').classList.add('hidden'); $('#shell').classList.remove('hidden'); $('#pv').classList.toggle('hidden', !IS_PREVIEW); render();
}
